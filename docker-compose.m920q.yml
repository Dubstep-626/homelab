# M920q — always-on services box (Debian 13, Tailscale runs on the host).
# NAS-side exporters/agents are reached at 192.168.0.172.

name: homelab-bundle

networks:
  homelab:
    driver: bridge

volumes:
  uptime-kuma-data:
  prometheus-data:
  grafana-data:
  grafana-dashboards:
  scrypted-data:
  diun-data:
  fail2ban-config:

services:

  # --- Reverse proxy ---------------------------------------------------
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/logs:/var/log/nginx

  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: fail2ban
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - fail2ban-config:/data
      - ./nginx/logs:/var/log/nginx:ro
      - /var/log:/var/log:ro

  # --- Container lifecycle (this host only) ----------------------------
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    networks:
      - homelab
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - WATCHTOWER_MONITOR_ONLY=true

  diun:
    image: crazymax/diun:latest
    container_name: diun
    restart: unless-stopped
    networks:
      - homelab
    command: serve
    volumes:
      - diun-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=America/Chicago
      - DIUN_WATCH_WORKERS=20
      - DIUN_WATCH_SCHEDULE=0 */6 * * *
      - DIUN_PROVIDERS_DOCKER=true

  # --- Monitoring ------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    networks:
      - homelab
    environment:
      - DOZZLE_ADDR=:8888
      - DOZZLE_HOSTNAME=m920q
      - DOZZLE_REMOTE_AGENT=192.168.0.172:7007
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks:
      - homelab
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - homelab
    volumes:
      - grafana-data:/var/lib/grafana
      - grafana-dashboards:/var/lib/grafana/dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=http://grafana.lab.lan:8080/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false

  unpoller:
    image: ghcr.io/unpoller/unpoller:latest
    container_name: unpoller
    restart: unless-stopped
    networks:
      - homelab
    environment:
      - UP_UNIFI_DEFAULT_URL=${UNIFI_CONTROLLER_URL}
      - UP_UNIFI_DEFAULT_USER=${UNIFI_USER}
      - UP_UNIFI_DEFAULT_PASS=${UNIFI_PASSWORD}
      - UP_UNIFI_DEFAULT_VERIFY_SSL=false
      - UP_PROMETHEUS_HTTP_LISTEN=0.0.0.0:9130
      - UP_INFLUXDB_DISABLE=true

  # M920q's own host + container metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    networks:
      - homelab
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - "--path.rootfs=/host"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    networks:
      - homelab
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    privileged: true

  # --- Dashboard + control ---------------------------------------------
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    networks:
      - homelab
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./homepage-config:/app/config
    environment:
      - PUID=0
      - PGID=0
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS}
      - HOMEPAGE_VAR_PVE_USER=${PROXMOX_TOKEN_ID}
      - HOMEPAGE_VAR_PVE_PASS=${PROXMOX_TOKEN_SECRET}
      - HOMEPAGE_VAR_IDRAC_USER=${IDRAC_RO_USER}
      - HOMEPAGE_VAR_IDRAC_PASS=${IDRAC_RO_PASS}
      - HOMEPAGE_VAR_UNIFI_USER=${UNIFI_USER}
      - HOMEPAGE_VAR_UNIFI_PASS=${UNIFI_PASSWORD}

  control-api:
    build: ./control-api
    container_name: control-api
    restart: unless-stopped
    networks:
      - homelab
    environment:
      - CONTROL_API_TOKEN=${CONTROL_API_TOKEN}
      - PROXMOX_HOST=${PROXMOX_HOST}
      - PROXMOX_NODE=${PROXMOX_NODE}
      - PROXMOX_TOKEN_ID=${PROXMOX_TOKEN_ID}
      - PROXMOX_TOKEN_SECRET=${PROXMOX_TOKEN_SECRET}
      - IDRAC_HOST=${IDRAC_HOST}
      - IDRAC_USER=${IDRAC_USER}
      - IDRAC_PASS=${IDRAC_PASS}
      - IDRAC_SYSTEM_ID=${IDRAC_SYSTEM_ID:-System.Embedded.1}

  # --- Cameras ---------------------------------------------------------
  scrypted:
    image: ghcr.io/koush/scrypted:latest
    container_name: scrypted
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - 10443:10443
    volumes:
      - scrypted-data:/server/volume

  # One-shot Kuma seeder (manual: docker compose run --rm kuma-seed)
  kuma-seed:
    build: ./kuma-seed
    container_name: kuma-seed
    profiles: ["seed"]
    networks:
      - homelab
    environment:
      - KUMA_URL=http://uptime-kuma:3001
      - KUMA_USERNAME=${KUMA_USERNAME}
      - KUMA_PASSWORD=${KUMA_PASSWORD}
