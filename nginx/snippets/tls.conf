# Included in every lab site's server block: HTTPS with the wildcard *.lab.mitchthedubs.com certificate
# (Let's Encrypt via DNS-01 at Cloudflare, renewed by the certbot container).
listen 443 ssl;
http2 on;
ssl_certificate     /etc/letsencrypt/live/lab.mitchthedubs.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/lab.mitchthedubs.com/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:LabTLS:10m;
ssl_session_timeout 1d;
# plain-HTTP requests for the new names go to HTTPS; *.lab.lan stays on HTTP
if ($lab_https_redirect) { return 301 https://$host$request_uri; }
