# /etc/sysctl.d/99-nonlocal-bind.conf (M920q)
# Containers that publish on 192.168.0.91 (uptime-kuma) fail to start if Docker comes up before DHCP
# has assigned that address; restart policies don't retry a failed start at boot. This lets the bind
# succeed early and the address arrives a few seconds later.
net.ipv4.ip_nonlocal_bind = 1
net.ipv6.ip_nonlocal_bind = 1
