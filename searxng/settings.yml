# SearXNG for Jarvis: private metasearch, reachable only on the Docker network.
use_default_settings: true
general:
  instance_name: "Jarvis search"
server:
  # secret_key is overridden by the SEARXNG_SECRET env var (set in .env)
  secret_key: "overridden-by-env"
  limiter: false
  image_proxy: false
  method: "GET"
search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json
