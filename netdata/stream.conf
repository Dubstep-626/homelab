# ============================================================
# PARENT stream.conf — lives on the DXP2800
# Mounted into the netdata container at /etc/netdata/stream.conf
# ============================================================

[stream]
    enabled = no
    # the DXP2800 is the parent — it does not stream OUT anywhere

[<STREAM_API_KEY>]   # generate with: uuidgen
    enabled = yes
    default history = 3600
    default memory mode = dbengine
    health enabled by default = auto
    allow from = 100.64.0.0/10   # tailnet range
