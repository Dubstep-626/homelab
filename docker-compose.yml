
# DXP2800 (Intel N100) homelab stack: monitoring, dashboards, UPS handling, split DNS.
# Secrets come from .env (see .env.example). Never commit .env.

networks:
  homelab:
    driver: bridge

volumes:
  uptime-kuma-data:
  netdata-config:
  netdata-lib:
  netdata-cache:
  homepage-config:
  fail2ban-config:
  scrutiny-config:
  scrutiny-influxdb:
  diun-data:
  prometheus-data:
  grafana-data:
  grafana-dashboards:
  nut-server-config:
  scrypted-data:

services:

  # ---------------------------------------------------------------------
  # Reverse proxy
  # ---------------------------------------------------------------------
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/logs:/var/log/nginx

  # ---------------------------------------------------------------------
  # Networking / remote access
  # ---------------------------------------------------------------------
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    hostname: dxp2800
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ACCEPT_DNS=false
      - TS_USERSPACE=false
    volumes:
      - ./tailscale/state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host

  # ---------------------------------------------------------------------
  # Security
  # ---------------------------------------------------------------------
  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: fail2ban
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - fail2ban-config:/data
      - ./nginx/logs:/var/log/nginx:ro
      - /var/log:/var/log:ro

  # ---------------------------------------------------------------------
  # Container lifecycle management
  # ---------------------------------------------------------------------
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    networks:
      - homelab
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - WATCHTOWER_MONITOR_ONLY=true

  # ---------------------------------------------------------------------
  # Uptime / status monitoring
  # ---------------------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
      # Read-only socket access is what lets Kuma's "Docker Container"
      # monitor type check real container state directly, rather than
      # pinging a port and hoping that means the service is healthy.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ---------------------------------------------------------------------
  # Dashboard (Heimdall replacement)
  # ---------------------------------------------------------------------
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    networks:
      - homelab
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./homepage-config:/app/config
    environment:
      - PUID=0
      - PGID=0
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS}
      - HOMEPAGE_VAR_PVE_USER=${PROXMOX_TOKEN_ID}
      - HOMEPAGE_VAR_PVE_PASS=${PROXMOX_TOKEN_SECRET}
      - HOMEPAGE_VAR_IDRAC_USER=${IDRAC_RO_USER}
      - HOMEPAGE_VAR_IDRAC_PASS=${IDRAC_RO_PASS}
      - HOMEPAGE_VAR_UNIFI_USER=${UNIFI_USER}
      - HOMEPAGE_VAR_UNIFI_PASS=${UNIFI_PASSWORD}

  # ---------------------------------------------------------------------
  # NAS / host / container metrics
  # ---------------------------------------------------------------------
  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    restart: unless-stopped
    hostname: dxp2800
    networks:
      - homelab
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - netdata-config:/etc/netdata
      - ./netdata/stream.conf:/etc/netdata/stream.conf:ro
      - netdata-lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata

  # ---------------------------------------------------------------------
  # Container log viewer
  # ---------------------------------------------------------------------
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    networks:
      - homelab
    environment:
      - DOZZLE_ADDR=:8888
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ---------------------------------------------------------------------
  # Drive health (S.M.A.R.T.) monitoring
  # ---------------------------------------------------------------------
  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    restart: unless-stopped
    networks:
      - homelab
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    volumes:
      - scrutiny-config:/opt/scrutiny/config
      - scrutiny-influxdb:/opt/scrutiny/influxdb
      - /run/udev:/run/udev:ro
    devices:
      # Add one line per physical drive on the DXP2800, e.g.:
      - /dev/sda

  # ---------------------------------------------------------------------
  # Image update notifications (Watchtower runs monitor-only; nothing auto-updates)
  # ---------------------------------------------------------------------
  diun:
    image: crazymax/diun:latest
    container_name: diun
    restart: unless-stopped
    networks:
      - homelab
    command: serve
    volumes:
      - diun-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=America/New_York
      - DIUN_WATCH_WORKERS=20
      - DIUN_WATCH_SCHEDULE=0 */6 * * *
      - DIUN_PROVIDERS_DOCKER=true

  # ---------------------------------------------------------------------
  # Control API — Proxmox VM control + iDRAC power control (Redfish). Source not published here.
  # ---------------------------------------------------------------------
  control-api:
    build: ./control-api
    container_name: control-api
    restart: unless-stopped
    networks:
      - homelab
    environment:
      - CONTROL_API_TOKEN=${CONTROL_API_TOKEN}
      - PROXMOX_HOST=${PROXMOX_HOST}
      - PROXMOX_NODE=${PROXMOX_NODE}
      - PROXMOX_TOKEN_ID=${PROXMOX_TOKEN_ID}
      - PROXMOX_TOKEN_SECRET=${PROXMOX_TOKEN_SECRET}
      - IDRAC_HOST=${IDRAC_HOST}
      - IDRAC_USER=${IDRAC_USER}
      - IDRAC_PASS=${IDRAC_PASS}
      - IDRAC_SYSTEM_ID=${IDRAC_SYSTEM_ID:-System.Embedded.1}

  # ---------------------------------------------------------------------
  # Metrics store
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks:
      - homelab
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"

  # ---------------------------------------------------------------------
  # Dashboards — this is what gives you the multi-panel layout
  # ---------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - homelab
    volumes:
      - grafana-data:/var/lib/grafana
      - grafana-dashboards:/var/lib/grafana/dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=http://grafana.lab.lan:8080/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false

  # ---------------------------------------------------------------------
  # Host metrics (CPU, RAM, disk, network) — this instance covers the NAS
  # itself. Other hosts run node_exporter natively and are scraped by Prometheus.
  # ---------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    networks:
      - homelab
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - "--path.rootfs=/host"

  # ---------------------------------------------------------------------
  # Per-container CPU/memory/network — feeds the "by Docker Container" panels
  # ---------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    networks:
      - homelab
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - ${DOCKER_ROOT:-/volume1/@docker}:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    privileged: true

  # ---------------------------------------------------------------------
  # Drive S.M.A.R.T. health in Prometheus format — same data Scrutiny
  # shows, exported so Grafana can graph it and trend it over time
  # ---------------------------------------------------------------------
  smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter:latest
    container_name: smartctl-exporter
    restart: unless-stopped
    networks:
      - homelab
    privileged: true
    user: root
    devices:
      - /dev/sda:/dev/sda

  # ---------------------------------------------------------------------
  # NUT server — UPS is plugged into THIS NAS via USB (CyberPower).
  # This container talks to the UPS directly and serves status over the
  # network on port 3493, same as a native install would, just
  # containerized since the NAS doesn't support native package installs.
  # The host-side shutdown watcher is in host/homelab-ups-watch.sh.
  # ---------------------------------------------------------------------
  nut-server:
    image: instantlinux/nut-upsd:2.8.1-r0
    container_name: nut-server
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - 3493:3493
    device_cgroup_rules:
      - 'c 189:* rwm'
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - nut-server-config:/etc/nut
      - ./nut-server/flag:/tmp/nut-flag
      - ./nut-server/notify.sh:/usr/local/bin/notify.sh:ro
    environment:
      # instantlinux/nut-upsd variable names (NAME / API_USER / API_PASSWORD / DRIVER)
      - NAME=${NUT_UPS_NAME}
      - API_USER=${NUT_MON_USER}
      - API_PASSWORD=${NUT_MON_PASSWORD}
      - DRIVER=usbhid-ups
      - NOTIFYCMD=/usr/local/bin/notify.sh

  # ---------------------------------------------------------------------
  # UPS status/runtime, pulled from the NUT server container (also on the NAS)
  # ---------------------------------------------------------------------
  nut-exporter:
    image: druggeri/nut_exporter:latest
    container_name: nut-exporter
    restart: unless-stopped
    networks:
      - homelab
    environment:
      - NUT_EXPORTER_SERVER=nut-server
      - NUT_EXPORTER_USERNAME=${NUT_MON_USER}
      - NUT_EXPORTER_PASSWORD=${NUT_MON_PASSWORD}

  # ---------------------------------------------------------------------
  # UniFi (UDR7 + Flex 2.5G switch) — client counts, WAN traffic, per-port
  # switch stats, exported for Grafana
  # ---------------------------------------------------------------------
  unpoller:
    image: ghcr.io/unpoller/unpoller:latest
    container_name: unpoller
    restart: unless-stopped
    networks:
      - homelab
    environment:
      - UP_UNIFI_DEFAULT_URL=${UNIFI_CONTROLLER_URL}
      - UP_UNIFI_DEFAULT_USER=${UNIFI_USER}
      - UP_UNIFI_DEFAULT_PASS=${UNIFI_PASSWORD}
      - UP_UNIFI_DEFAULT_VERIFY_SSL=false
      - UP_PROMETHEUS_HTTP_LISTEN=0.0.0.0:9130
      - UP_INFLUXDB_DISABLE=true

  # ---------------------------------------------------------------------
  # One-shot: seeds Uptime Kuma with an hourly Docker-container health
  # check for every service in this stack. Gated behind a profile so it
  # never runs as part of a normal `docker compose up -d`. Source not
  # published in this repo.
  #   docker compose run --rm kuma-seed
  # ---------------------------------------------------------------------
  kuma-seed:
    build: ./kuma-seed
    container_name: kuma-seed
    profiles: ["seed"]
    networks:
      - homelab
    environment:
      - KUMA_URL=http://uptime-kuma:3001
      - KUMA_USERNAME=${KUMA_USERNAME}
      - KUMA_PASSWORD=${KUMA_PASSWORD}

  # ---------------------------------------------------------------------
  # Scrypted — Blink camera bridge for continuous live view (4x Blink
  # Mini/Mini 2, wired). Keeps Blink's cloud live-view session alive and
  # rebroadcasts it as a local, persistent stream instead of a one-shot
  # snapshot. Runs on bridge networking here since the goal is just the
  # web dashboard for the iPad; if you later want HomeKit/mDNS discovery
  # for these cameras, switch this to `network_mode: host` (drop the
  # `networks:`/`ports:` lines below).
  # Blink login/2FA happens once through the Scrypted web UI itself,
  # nothing needed in .env for it.
  # ---------------------------------------------------------------------
  scrypted:
    image: ghcr.io/koush/scrypted:latest
    container_name: scrypted
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - 10443:10443
    volumes:
      - scrypted-data:/server/volume
  # ---------------------------------------------------------------------
  # Split-DNS for *.lab.lan over Tailscale (bound to the tailscale IP only)
  # ---------------------------------------------------------------------
  dnsmasq:
    build: ./dnsmasq
    container_name: dnsmasq
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - "<TAILSCALE_IP>:53:53/udp"
      - "<TAILSCALE_IP>:53:53/tcp"
    volumes:
      - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
